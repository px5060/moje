<html lang="pl">
<head>

<title>MOJE</title>

<style>
:root{--bg:#12151c;--pan:#1b1f2a;--card:#242a38;--bd:#323a4d;--tx:#e8ebf2;--mu:#8b93a7;--or:#ff6600;--or2:#ff9a4d;--gr:#5fd38a;--rd:#ff8a8a;--bl:#9fc4ff;--ye:#FFD700}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--pan);border-bottom:1px solid var(--bd);padding:8px 12px}
header .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
header h1{font-size:16px;margin:0}header .n{color:var(--mu);font-size:12px}
main{padding:10px 12px 90px;max-width:760px;margin:0 auto}
.btn{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600}
.btn.pri{background:var(--or);border-color:var(--or);color:#fff}.btn.ok{background:#1f8a4c;border-color:#1f8a4c;color:#fff}
.btn.wide{display:block;width:100%;margin-top:7px;text-align:center}
.btn.sm{padding:4px 9px;font-size:12.5px}
a.btn{text-decoration:none}
.hint{color:var(--mu);font-size:11.5px;margin-top:4px}
.chip{position:relative;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:16px;padding:5px 11px;font-size:13px;font-weight:600}
.chip.on{background:var(--or);border-color:var(--or);color:#fff}
.flt{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
/* wpis kodów */
.kod{background:var(--pan);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.kod .kh{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.kod .kh b{font-size:15px}
.kod .last{font-size:14px;margin-top:4px}
.kod .last .c{background:#2b4a37;border-radius:5px;padding:1px 7px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums}
.kod .when{font-weight:800;color:var(--gr)}.kod .when.old{color:var(--ye)}.kod .when.vold{color:var(--rd)}
.kod .src{color:var(--mu);font-size:11.5px}
.erow{display:flex;gap:6px;margin-top:7px}
.erow input{flex:1;min-width:0;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:8px 10px;font-size:18px;letter-spacing:3px}
.prev{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--mu);align-items:center}
.prev b{color:var(--tx);background:var(--card);border-radius:5px;padding:1px 5px;font-weight:600;font-variant-numeric:tabular-nums}
/* grupy */
.grp{margin:14px 0 6px;font-weight:800;font-size:14px;display:flex;justify-content:space-between;align-items:baseline}
.grp .m{color:var(--mu);font-size:12px;font-weight:500}
.mc{border-left:6px solid var(--bd);background:var(--card);border-radius:9px;padding:8px 10px;margin-bottom:7px;cursor:pointer}
.mc.now{border-left-color:var(--or);background:#3a2a1c;box-shadow:0 0 0 1px var(--or) inset}
.mc.soon{border-left-color:var(--ye)}.mc.wait{border-left-color:#2e75b6}.mc.bust{border-left-color:#ff4444}
.mc.done{border-left-color:var(--gr);opacity:.85}.mc.donel{border-left-color:#a0606a;opacity:.85}
.mc .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mc .id{font-weight:800;font-size:14px}
.mc .rule{color:var(--mu);font-size:11.5px;margin-top:2px;word-break:break-word}
.mc .st{margin-top:4px;font-size:13.5px}
.mc .big{font-size:16px;font-weight:800;color:#fff}
.mc .bet{margin-top:5px;font-size:12.5px;color:var(--bl)}
.mc .row2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.bdg{display:inline-block;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:800;color:#fff;margin-right:4px;vertical-align:1px}
.bdg.S{background:#2e75b6}.bdg.Sp{background:#7030a0}.bdg.B{background:#b3261e}
.kk{display:inline-block;border-radius:5px;padding:0 6px;background:#3d4760;font-weight:800;font-size:12.5px}
.pos{color:var(--gr)}.neg{color:var(--rd)}.mu{color:var(--mu)}
.empty{background:var(--pan);border:1px dashed var(--bd);border-radius:10px;padding:14px;color:var(--mu);text-align:center}
details{margin-top:10px}summary{cursor:pointer;font-weight:700;color:var(--mu);padding:6px 0}
/* zakłady */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.sum div{background:var(--pan);border:1px solid var(--bd);border-radius:9px;padding:7px;text-align:center;font-size:11.5px;color:var(--mu)}
.sum b{display:block;font-size:17px;color:var(--tx)}
.bt{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:8px;padding:7px 9px;margin-bottom:5px;cursor:pointer;font-size:13px}
.bt .r{margin-left:auto;text-align:right;font-weight:700}
.bt.win{border-left:4px solid var(--gr)}.bt.lost{border-left:4px solid #ff4444}.bt.pend{border-left:4px solid var(--or)}.bt.none{border-left:4px solid var(--mu)}
/* model */
.box{background:var(--pan);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;margin-bottom:9px}
.box h4{margin:0 0 6px;font-size:13.5px}
.box ol{margin:0;padding-left:20px}.box li{margin:3px 0}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.kv div{background:var(--card);border-radius:7px;padding:5px;text-align:center;font-size:11px;color:var(--mu)}
.kv b{display:block;font-size:15px;color:var(--tx)}
.bars{display:flex;gap:4px;align-items:flex-end;height:70px;margin-top:6px}
.bars div{flex:1;background:#2e75b6;border-radius:3px 3px 0 0;position:relative;min-height:2px}
.bars span{position:absolute;top:-15px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--tx)}
.bl{display:flex;gap:4px;font-size:10.5px;color:var(--mu)}.bl span{flex:1;text-align:center}
.cyc{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.cyc b{font-size:11px;border-radius:4px;padding:1px 4px;background:#2b4a37}.cyc b.x{background:#8a1f1f}
table.rows{width:100%;border-collapse:collapse;font-size:12.5px}
table.rows td{padding:4px 5px;border-top:1px solid var(--bd)}
table.rows td.nr{color:var(--mu);width:62px;font-variant-numeric:tabular-nums}table.rows td.cd{width:44px;font-weight:700;letter-spacing:1px}
table.rows tr.k6 td{background:#1f3d2a}table.rows tr.k7 td{background:#3d1f22}table.rows tr.k8 td{background:#6b1414}
table.rows tr.k4 td,table.rows tr.k5 td{background:#3a2a1c}table.rows tr.k3 td,table.rows tr.k10 td{color:var(--bl)}
table.rows tr.nx td{background:#ff6600;color:#fff;font-weight:800}
.back{margin-bottom:8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--pan);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:12px 4px;font-size:14px;font-weight:700;position:relative}
nav button.on{color:var(--or2)}
nav b.soon,.grp b.soon{position:absolute;top:3px;left:calc(50% - 46px);min-width:16px;height:16px;border-radius:8px;background:var(--ye);color:#000;font:700 10px/16px system-ui;padding:0 4px;border:1px solid #fff}
nav i.nb{position:absolute;top:3px;left:calc(50% + 30px);min-width:16px;height:16px;border-radius:8px;background:#FF6600;color:#fff;font:700 10px/16px system-ui;font-style:normal;padding:0 4px;border:1px solid #fff}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#000d;color:#fff;padding:8px 14px;border-radius:9px;font-size:13px;z-index:70;max-width:92vw}
.respop{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);z-index:60;width:min(94vw,560px);border-radius:12px;padding:10px 14px;color:#fff;box-shadow:0 8px 30px #000a;cursor:pointer}
.respop.win{background:#1f8a4c}.respop.loss{background:#b3261e}.respop.nil{background:#2b3245}
.respop .h{font-size:20px;font-weight:900}.respop .i{padding:3px 0;border-top:1px solid #ffffff33;font-size:13px}.respop .x{font-size:11px;opacity:.75;margin-top:5px;text-align:right}
</style>

  h += `<div class="box"><h4>Ostatnie 30 wierszy (najnowszy na górze)</h4><table class="rows">
    ${r.ph === 2 ? `<tr class="${nx ? 'nx' : 'k5'}"><td class="nr">Nr ${fmtN(r.wz + 1)}</td><td class="cd">?</td><td>${nx ? 'GRAJ TERAZ' : 'tu będzie zakład'} · k${r.bs + 1} · ${ST[r.bs]} zł</td></tr>` : ''}
    ${rows.map(i => `<tr class="k${lab.K[i]}"><td class="nr">${fmtN(i + 1)}</td><td class="cd">${code(it.t, i)}</td><td>${LT(it, lab.K[i], lab.A[i], lab.B[i], i)}</td></tr>`).join('')}</table></div>`;
  const B = betsOf(it).sort((a, b) => b.b.row - a.b.row);
  if (B.length) h += `<div class="box"><h4>Moje zakłady na tym modelu</h4>${B.map(x => `<div class="bt ${x.res}"><div>Nr ${fmtN(x.b.row + 1)} · k${x.b.step} · ${x.b.stake} zł <span class="mu">(${ago(x.b.t)})</span></div><div class="r">${x.res === 'pend' ? 'czeka' : x.res === 'none' ? '<span class="mu">nie grał</span>' : zl(betVal(x))} <button class="btn sm" data-delbet="${bets.indexOf(x)}">✕</button></div></div>`).join('')}</div>`;
  h += `<a class="btn wide" href="${it.s.url[it.t]}">Otwórz ${esc(it.s.name)} ${TABS[it.t].name}</a>
    <button class="btn wide" data-untrack="1" style="color:var(--rd)">${it.gone ? 'Ukryj ten BUST' : 'Przestań śledzić (usuń z MOJE)'}</button>`;
  return h;
}
function pomoc() {
  return `<div class="box"><h4>Co tu jest</h4>MOJE zbiera modele, które grasz, ze wszystkich aplikacji: <span class="bdg S">S</span>SZUKAJ, <span class="bdg Sp">S+</span>SZUKAJ+, <span class="bdg B">B</span>SZUKAJ BUST — dla T50 i T60. Liczba przy znaczku = tabela (S50, S+60…).</div>
    <div class="box"><h4>Grupy na ekranie TERAZ</h4>🟧 <b>GRAJ TERAZ</b> — zakład na następnym wierszu (kwota i krok na karcie).<br>🟨 <b>ZA 2–3 WIERSZE</b> — TRIGGER już był, zakład za chwilę.<br>🟥 <b>BUST</b> — model przegrał krok 8 (512 zł); znika po pierwszym WIN.<br>🟦 <b>W GRZE</b> — czeka na STEP albo TRIGGER.<br>✅ <b>ZAKOŃCZONE</b> — po WIN (rozwiń na dole).</div>
    <div class="box"><h4>Znaczki na TERAZ</h4><b style="background:#FF6600;color:#fff;border-radius:8px;padding:0 5px">2</b> pomarańczowy = ile modeli gra na następnym wierszu.<br><b style="background:#FFD700;color:#000;border-radius:8px;padding:0 5px">2,3</b> żółty = za ile wierszy grają kolejne.</div>
    <div class="box"><h4>Kody</h4>Kody są wspólne z RAZEM i SZUKAJ — wpisany tu kod jest od razu we wszystkich aplikacjach (i odwrotnie). Przy każdej tabeli widać ostatni kod i <b>kiedy</b> go wpisano. Gdy kod wpisano w innej aplikacji, MOJE pokazuje, kiedy go tu zauważyło (przy otwarciu).</div>
    <div class="box"><h4>Zakłady</h4>„💰 Zapisz zakład” zapisuje zakład w MOJE ZAKŁADY aplikacji, z której jest model — widać go tu i tam. Wynik liczy się sam po wpisaniu kodu.</div>
    <div class="box"><h4>Dodawanie modeli</h4>W aplikacji SZUKAJ przytrzymaj kartę modelu → <b>⇢ Gram — dodaj do MOJE</b>. Aplikacja doda model i otworzy go tutaj.</div>
    <div class="hint">MOJE ${APP_VER}</div>`;
}
function render() {
  $('ver').textContent = APP_VER;
  const v = view === 'model' ? 'teraz' : view;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  const act = items.filter(it => it.grp !== 'done' && it.r.ph === 2), now = act.filter(it => it.d === 1).length;
  const soon = [...new Set(act.map(it => it.d).filter(d => d >= 2 && d <= 3))].sort();
  $('navT').innerHTML = `TERAZ${soon.length ? `<b class="soon">${soon.join(',')}</b>` : ''}${now ? `<i class="nb">${now}</i>` : ''}`;
  const pend = bets.filter(x => x.res === 'pend').length;
  $('navZ').innerHTML = `ZAKŁADY${pend ? `<i class="nb">${pend}</i>` : ''}`;
  const ae = document.activeElement, keep = ae && ae.id && ae.id.startsWith('in_') ? [ae.id, ae.value] : null;
  $('main').innerHTML = view === 'teraz' ? teraz() : view === 'zak' ? zaklady() : view === 'model' ? model() : pomoc();
  if (keep && $(keep[0])) { $(keep[0]).value = keep[1]; $(keep[0]).focus(); }
}
function go(v, u) { view = v; sel = u || null; render(); window.scrollTo(0, 0); }
document.addEventListener('click', e => {
  const q = s => e.target.closest(s);
  let b;
  if ((b = q('nav button'))) return go(b.dataset.v);
  if ((b = q('[data-add]'))) { const t = b.dataset.add, i = $('in_' + t); addCode(t, i.value.trim()); return; }
  if ((b = q('[data-undo]'))) return undoCode(b.dataset.undo);
  if ((b = q('[data-only]'))) { only = b.dataset.only; lsSet('moje_v1_only', only); return render(); }
  if ((b = q('[data-bet]'))) { e.stopPropagation(); const it = items.find(x => x.uid === b.dataset.bet); if (it) saveBet(it); return; }
  if ((b = q('[data-delbet]'))) { e.stopPropagation(); return delBet(bets[+b.dataset.delbet]); }
  if ((b = q('[data-untrack]'))) { const it = items.find(x => x.uid === sel); if (it) untrack(it); return; }
  if ((b = q('[data-go]'))) return go(b.dataset.go);
  if ((b = q('.mc[data-u]'))) return go('model', b.dataset.u);
  if ((b = q('.bt[data-bi]'))) { const x = bets[+b.dataset.bi]; if (x && x.it) go('model', x.it.uid); else toast('Tego modelu nie ma już w MOJE'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id && e.target.id.startsWith('in_')) { const t = e.target.id.slice(3); addCode(t, e.target.value.trim()); } });
document.addEventListener('input', e => {   // 3 cyfry → od razu dodaj
  const t = e.target.id && e.target.id.startsWith('in_') ? e.target.id.slice(3) : null; if (!t) return;
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 3);
  if (e.target.value.length === 3 && validCode(t, e.target.value)) addCode(t, e.target.value);
});
window.addEventListener('storage', () => reload());
document.addEventListener('visibilitychange', () => { if (!document.hidden) reload(); });
setInterval(() => { if (!document.hidden && !(document.activeElement && document.activeElement.tagName === 'INPUT')) render(); }, 30000);
reload();
// ?open=<t>~<app>~<cel>~<model> — z aplikacji SZUKAJ („⇢ Gram — dodaj do MOJE”): od razu ekran modelu
(() => { const u = new URLSearchParams(location.search).get('open'); if (!u) return;
  history.replaceState(null, '', location.pathname);
  if (items.some(x => x.uid === u)) go('model', u); else toast('Model jeszcze nie jest w MOJE'); })();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('moje-sw.js').catch(() => {});
</script>
</body>
