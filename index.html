.btn{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600}

.btn.wide{display:block;width:100%;margin-top:7px;text-align:center}
.btn.sm{padding:4px 9px;font-size:12.5px}
a.btn{text-decoration:none}
.hint{color:var(--mu);font-size:11.5px;margin-top:4px}

.tsw{display:flex;gap:8px;margin-bottom:8px}.tsw button{flex:1;position:relative;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:10px;font-size:17px;font-weight:800}

.sec{background:var(--pan);border:1px solid var(--bd);border-radius:11px;padding:6px 8px;margin-bottom:10px}

.sec.sheld{border-color:#5a4a8a}.sec.snow{border-color:var(--or);box-shadow:0 0 0 1px var(--or) inset}.sec.ssoon{border-color:#8a7a20}.sec.sbust{border-color:#8a1f1f}
.sec.link{cursor:pointer}.sec .sh b.soon,.sec .sh i.nb{position:static;display:inline-block;margin-left:6px;min-width:18px;height:18px;border-radius:9px;font:700 11px/18px system-ui;text-align:center;padding:0 4px}
.sec .sh b.soon{background:var(--ye);color:#000}.sec .sh i.nb{background:#c97a45;color:#fff;font-style:normal}
.sec .none{color:var(--mu);font-size:12.5px;padding:2px 4px 6px}
.sec .kh{color:var(--mu);font-size:12px;font-weight:700;margin:8px 2px 4px;border-bottom:1px solid var(--bd);padding-bottom:2px}
details.sec>summary{list-style:none}[data-lp]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}details.sec>summary::-webkit-details-marker{display:none}details.sec>summary .m::after{content:' ▾'}details.sec[open]>summary .m::after{content:' ▴'}

.rw.abust{border:4px solid transparent;border-image:repeating-linear-gradient(-45deg,#a8423a 0 10px,#e8e2e2 10px 20px) 4}

.rw.bnow{border:3px solid #8e2a2a;background:#2e1a1c;box-shadow:0 0 0 1px #8e2a2a inset}.rw.bnow .graj{background:#8e2a2a}
.sec.slnow{border-color:#8e2a2a;box-shadow:0 0 0 1px #8e2a2a inset}
.rw .graj{background:#c97a45;color:#fff;font-weight:800;font-size:14px;border-radius:6px;padding:5px 8px;margin-bottom:5px}
.rw.abust .graj{background:#8e2a2a}
.rw.Sp{border-left-color:#7030a0}.rw.R{border-left-color:#1f8a4c}.rw.B{border-left-color:#b3261e}.rw.now{background:#3a2a1c}
.rw .l1{display:flex;align-items:center;gap:6px;font-size:14px}.rw .l1 .sp{flex:1}.rw .l1 .zl{min-width:52px;text-align:right}.rw .l1 .btn{padding:3px 9px}.rw .l1 .ok{font-weight:800;padding:0 6px}
.rw .l2{color:var(--mu);font-size:12px;margin-top:2px}
.rw .l3{color:var(--mu);font-size:11.5px;margin-top:3px;display:flex;align-items:center;gap:3px;flex-wrap:wrap}.rw .l3 b{margin:0 2px}.rw .l3 i{font-style:normal;font-weight:700;font-size:11px;color:#fff;border-radius:4px;padding:1px 5px;background:#2b7a4b}.rw .l3 i.x{background:#8e2a2a}.rw.now .l2{color:#ffd0a8}.rw .bdg{margin-right:0}
.flt{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
/* wpis kodów */
.kod{background:var(--pan);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.kod .kh{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.kod .kh b{font-size:15px}
.kod .last{font-size:14px;margin-top:4px}
.kod .last .c{background:#2b4a37;border-radius:5px;padding:1px 7px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums}
.kod .when{font-weight:800;color:var(--gr)}.kod .when.old{color:var(--ye)}.kod .when.vold{color:var(--rd)}
.kod .src{color:var(--mu);font-size:11.5px}
.erow{display:flex;gap:6px;margin-top:7px}
.erow input{flex:1;min-width:0;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:8px 10px;font-size:18px;letter-spacing:3px}
.prev{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--mu);align-items:center}
.prev b{color:var(--tx);background:var(--card);border-radius:5px;padding:1px 5px;font-weight:600;font-variant-numeric:tabular-nums}
/* grupy */
.grp{margin:14px 0 6px;font-weight:800;font-size:14px;display:flex;justify-content:space-between;align-items:baseline}
.grp .m{color:var(--mu);font-size:12px;font-weight:500}
.mc{border-left:6px solid var(--bd);background:var(--card);border-radius:9px;padding:8px 10px;margin-bottom:7px;cursor:pointer}
.mc.now{border-left-color:var(--or);background:#3a2a1c;box-shadow:0 0 0 1px var(--or) inset}
.mc.soon{border-left-color:var(--ye)}.mc.wait{border-left-color:#2e75b6}.mc.bust{border-left-color:#ff4444}
.mc.done{border-left-color:var(--gr);opacity:.85}.mc.donel{border-left-color:#a0606a;opacity:.85}
.mc .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mc .id{font-weight:800;font-size:14px}
.mc .rule{color:var(--mu);font-size:11.5px;margin-top:2px;word-break:break-word}
.mc .st{margin-top:4px;font-size:13.5px}
.mc .big{font-size:16px;font-weight:800;color:#fff}
.mc .bet{margin-top:5px;font-size:12.5px;color:var(--bl)}

.btf input{width:58px;padding:6px;border-radius:7px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;font-weight:700}.btf .fNr{width:84px}.btf .fZl{width:70px}
.btf button{flex:1;min-width:120px;padding:8px}.btf.wide button{font-size:14px}
.mc .row2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.bdg{display:inline-block;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:800;color:#fff;margin-right:4px;vertical-align:1px}
.bdg.S{background:#2e75b6}.bdg.R{background:#1f8a4c}.bdg.Sp{background:#7030a0}.bdg.B{background:#b3261e}
.kk{display:inline-block;border-radius:5px;padding:0 6px;background:#3d4760;font-weight:800;font-size:12.5px}
.pos{color:var(--gr)}.neg{color:var(--rd)}.mu{color:var(--mu)}
.empty{background:var(--pan);border:1px dashed var(--bd);border-radius:10px;padding:14px;color:var(--mu);text-align:center}
details{margin-top:10px}summary{cursor:pointer;font-weight:700;color:var(--mu);padding:6px 0}
/* zakłady */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.sum div{background:var(--pan);border:1px solid var(--bd);border-radius:9px;padding:7px;text-align:center;font-size:11.5px;color:var(--mu)}
.sum b{display:block;font-size:17px;color:var(--tx)}
.bt{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:8px;padding:7px 9px;margin-bottom:5px;cursor:pointer;font-size:13px}
.bt .r{margin-left:auto;text-align:right;font-weight:700}
.ub{background:transparent;border:1px solid var(--bd);color:var(--mu);border-radius:6px;padding:3px 8px;margin-top:4px;font:600 12px system-ui;cursor:pointer}.toast .ub{color:#fff;border-color:#fff;margin:0 0 0 8px}
.bt.win{border-left:4px solid var(--gr)}.bt.lost{border-left:4px solid #ff4444}.bt.pend{border-left:4px solid var(--or)}.bt.none{border-left:4px solid var(--mu)}
/* model */
.box{background:var(--pan);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;margin-bottom:9px}
.box h4{margin:0 0 6px;font-size:13.5px}
.box ol{margin:0;padding-left:20px}.box li{margin:3px 0}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.kv div{background:var(--card);border-radius:7px;padding:5px;text-align:center;font-size:11px;color:var(--mu)}
.kv b{display:block;font-size:15px;color:var(--tx)}
.bars{display:flex;gap:4px;align-items:flex-end;height:70px;margin-top:6px}
.bars div{flex:1;background:#2e75b6;border-radius:3px 3px 0 0;position:relative;min-height:2px}
.bars span{position:absolute;top:-15px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--tx)}
.bl{display:flex;gap:4px;font-size:10.5px;color:var(--mu)}.bl span{flex:1;text-align:center}
.cyc{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.cyc b{font-size:11px;border-radius:4px;padding:1px 4px;background:#2b4a37}.cyc b.x{background:#8a1f1f}

table.rows tr.k4 td,table.rows tr.k5 td{background:#3a2a1c}table.rows tr.k3 td,table.rows tr.k10 td{color:var(--bl)}
table.rows tr.nx td{background:#c97a45;color:#fff;font-weight:800}
.back{margin-bottom:8px}

nav button{flex:1;background:none;border:0;color:var(--mu);padding:12px 2px;font-size:13px;font-weight:700;position:relative}
nav button.on{color:var(--or2)}
nav b.soon,.grp b.soon{position:absolute;top:3px;left:2px;min-width:16px;height:16px;border-radius:8px;background:var(--ye);color:#000;font:700 10px/16px system-ui;padding:0 4px;border:1px solid #fff}

.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#000d;color:#fff;padding:8px 14px;border-radius:9px;font-size:13px;z-index:70;max-width:92vw}
.respop{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);z-index:60;width:min(94vw,560px);border-radius:12px;padding:10px 14px;color:#fff;box-shadow:0 8px 30px #000a;cursor:pointer}
.respop.win{background:#1f8a4c}.respop.loss{background:#b3261e}.respop.nil{background:#2b3245}

.bst{display:flex;gap:6px;align-items:center;margin-top:6px}.bst input{flex:1;min-width:0;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:7px 9px;font-size:15px}

.respop .h{font-size:20px;font-weight:900}.respop .i{padding:3px 0;border-top:1px solid #ffffff33;font-size:13px}.respop .x{font-size:11px;opacity:.75;margin-top:5px;text-align:right}

function LOSTIFY(doc, keepNames) {   // keepNames: zostaw nazwę tabeli / modeli „BUST” z RAZEM T60 (2 = też sam napis „BUST”, np. zakładka tabeli)
  try {
    if (!doc || doc.__lost) return; doc.__lost = 1;
    const RX = keepNames ? /\bBUST\b(?! 012| ODM| ·| [A-Z]\d[A-Z0-9])|\bbusty\b|\bBusty\b/g : /\bBUST\b|\bbusty\b|\bBusty\b/g;
    const keep = v => keepNames === 2 && /^\s*BUST\s*$/.test(v);
    const fix = n => { const pa = n.parentNode; if (pa && /^(SCRIPT|STYLE|TEXTAREA)$/.test(pa.nodeName)) return; const v = n.nodeValue; if (!v || !/BUST|usty/.test(v) || keep(v)) return; const f = v.replace(RX, m => m === 'BUST' ? 'LOST' : m === 'busty' ? 'losty' : 'Losty'); if (f !== v) n.nodeValue = f; };
    const walk = r => { if (r.nodeType === 3) return fix(r); if (r.nodeType !== 1 || /^(SCRIPT|STYLE|TEXTAREA)$/.test(r.nodeName)) return; const w = doc.createTreeWalker(r, 4); let n; while ((n = w.nextNode())) fix(n); };
    const root = doc.body || doc.documentElement; walk(root);
    new doc.defaultView.MutationObserver(ms => ms.forEach(m => m.type === 'characterData' ? fix(m.target) : m.addedNodes.forEach(walk)))
      .observe(root, { childList: true, subtree: true, characterData: true });
  } catch (e) {}
}
