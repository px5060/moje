<script>
(function () {   // pasek aplikacji: przyciski otwierające pozostałe aplikacje (ten sam adres px5060.github.io, wspólne kody)
  const A = [['/moje/', 'MOJE', '#c97a45'], ['/t50razem/', 'R50', '#2e7d4f'], ['/all60/', 'R60', '#2e7d4f'], ['/szukaj50/', 'S50', '#2e75b6'], ['/szukaj60/', 'S60', '#2e75b6'],
    ['/szukaj50plus/', 'S+50', '#7a3fb0'], ['/szukaj60plus/', 'S+60', '#7a3fb0'], ['/szukajbust50/', 'L50', '#8e2a2a'], ['/szukajbust60/', 'L60', '#8e2a2a'],
    ['intent://www.sofascore.com/#Intent;scheme=https;package=com.sofascore.results;S.browser_fallback_url=https%3A%2F%2Fwww.sofascore.com%2F;end', 'SOFA', '#5b6bd6']];   // aplikacja SofaScore (Android; bez niej strona www)
  const el = document.getElementById('appbar'), here = location.pathname.replace(/index\.html$/, '');
  if (el) el.innerHTML = [...A.filter(([u]) => here.endsWith(u)), ...A.filter(([u]) => !here.endsWith(u))].map(([u, l, c]) => here.endsWith(u) ? `<b style="background:${c}">${l}</b>` : `<a href="${u}" style="border-color:${c}">${l}</a>`).join('');
  // 1. dotknięcie powiększa przycisk, 2. dotknięcie powiększonego otwiera aplikację (żeby nie przełączyć przez przypadek)
  if (el) el.addEventListener('click', e => {
    const a = e.target.closest('a'); if (!a) return;
    if (a.classList.contains('big')) return;
    e.preventDefault(); el.querySelectorAll('a.big').forEach(x => x.classList.remove('big')); a.classList.add('big');
    clearTimeout(el._t); el._t = setTimeout(() => a.classList.remove('big'), 4000);
  });
})();
</script>

<script>
"use strict";
const APP_VER = '1.20.0';
const TABS = __TABS__;   // {t50:{name, seed, key, alph, targets}, t60:{…}} — kody wspólne z RAZEM i SZUKAJ (ten sam klucz pamięci)
// aplikacje źródłowe: ich MOJE (modele, które gram) i MOJE ZAKŁADY czytane ze wspólnej pamięci telefonu (ten sam adres px5060.github.io)
const SRC = [
  { a: 'S', cls: 'S', name: 'SZUKAJ', pfx: '_szukaj_v1_', nf: 5, url: { t50: '/szukaj50/', t60: '/szukaj60/' } },
  { a: 'S+', cls: 'Sp', name: 'SZUKAJ+', pfx: '_szukajp_v1_', nf: 7, url: { t50: '/szukaj50plus/', t60: '/szukaj60plus/' } },

];
const ST = [8, 8, 16, 32, 64, 128, 256, 512], CUM = [8, 16, 32, 64, 128, 256, 512, 1024];
const TPOS = { x1x: 1, xx1: 2, '1xx': 0 };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
const jget = k => { try { const v = JSON.parse(lsGet(k, '[]')); return Array.isArray(v) ? v : []; } catch (e) { return []; } };
const fmtN = n => n.toLocaleString('pl');
const zl = v => `<span class="${v > 0 ? 'pos' : v < 0 ? 'neg' : ''}">${v > 0 ? '+' : v < 0 ? '−' : ''}${fmtN(Math.abs(v))} zł</span>`;
function toast(t, ms) { document.querySelectorAll('.toast').forEach(x => x.remove()); const o = document.createElement('div'); o.className = 'toast'; o.innerHTML = t; document.body.appendChild(o); setTimeout(() => o.remove(), ms || 2600); }

// ---- czas słowami: „przed chwilą”, „5 minut temu”, „2 dni temu” ----
function pl(n, f) { const a = n % 10, b = n % 100; return n === 1 ? f[0] : a >= 2 && a <= 4 && (b < 12 || b > 14) ? f[1] : f[2]; }
function ago(t) {
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return 'przed chwilą';

    <div class="box"><h4>Zakładka BANK</h4>Bank +3 / +5 (bez limitu) dla modeli z SZUKAJ, SZUKAJ+ i SZUKAJ LOST. Bank gra w każdym cyklu modelu tylko pierwsze 3 (5) zakłady; model trafi → WIN banku (przeniesione kroki + krok modelu) i bank od k1; nie trafi → bank przegrywa 3 (5) kroki, czeka i w następnym cyklu gra dalej. Stawki 8 · 8 · 16 · 32 · 64 · 128 · 256 · 512, dalej ×2.<br>Model jest <b>albo na TERAZ</b> (prosta progresja k1–k8), <b>albo w BANK</b> (+3 / +5) — nigdy w obu. Przełącznik przy modelu (ekran modelu i <b>🔎 wyszukiwarka</b>): <b>🏦 Przenieś do BANK</b> / <b>🟧 Przenieś do TERAZ</b>. „✕ usuń z BANK” usuwa model całkiem (też z MOJE). Na TERAZ grupy <b>🟥 PO BUST</b> i <b>🏦 BANK</b> (zwijane jak pozostałe) pokazują to, co gra na następnym wierszu; <b>przytrzymanie</b> nagłówka przenosi do zakładki LOST / BANK. Przełącznik <b>BANK +3 / BANK +5</b> wybiera, który bank prowadzi listę. Droga modelu jak na TERAZ: 🟦 CZEKAJĄ (okno banku trwa, czeka na STEP / TRIGGER) → 🟨 ZA CHWILĘ → 🟧 GRAJ TERAZ. WIN → bank od k1 i znowu CZEKAJĄ. Bank przegrał swoje 3 (5) kroki → <b>⏸ CZEKAJĄ NA BANK</b>, aż model skończy cykl (WIN albo LOST) — potem znowu CZEKAJĄ, już na kolejnym oknie (np. k4–k6). Znaczki przy BANK, T50 / T60 i +3 / +5: żółty = za ile wierszy zakład banku, pomarańczowy = ile gra na następnym. Dotknięcie modelu → szanse zamknięcia banku na kolejnych krokach, stawki, gdzie bank się zamykał (% dla okien) i usunięcie z listy.</div>
    <div class="box"><h4>Zakłady</h4>„💰 Zapisz zakład” zapisuje zakład w MOJE ZAKŁADY aplikacji, z której jest model — widać go tu i tam. Wynik liczy się sam po wpisaniu kodu.</div>
    <div class="box"><h4>Dodawanie modeli</h4>W aplikacji SZUKAJ przytrzymaj kartę modelu → <b>⇢ Gram — dodaj do MOJE</b>. Aplikacja doda model i otworzy go tutaj.</div>
    <div class="hint">MOJE ${APP_VER}</div>`;
}
function render() {
  $('ver').textContent = APP_VER;
  const v = view === 'model' ? back : view === 'bankm' ? 'bank' : view;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  const act = vitems.filter(it => it.grp !== 'done' && it.grp !== 'bust' && it.r.ph === 2), now = act.filter(it => it.d === 1).length;
  const soon = [...new Set(act.map(it => it.d).filter(d => d >= 2 && d <= 3))].sort();
  $('navT').innerHTML = `TERAZ${soon.length ? `<b class="soon">${soon.join(',')}</b>` : ''}${now ? `<i class="nb">${now}</i>` : ''}`;
  const pend = bets.filter(x => x.res === 'pend').length;
  $('navB').innerHTML = `LOST${bustBadges(vitems.filter(it => it.inBust))}`;
  $('navZ').innerHTML = `ZAKŁADY${pend ? `<i class="nb">${pend}</i>` : ''}`;
  $('navK').innerHTML = `BANK${bankBadges(bitems)}`;
  const ae = document.activeElement, keep = ae && ae.id && /^(in|pa|bq)_/.test(ae.id) ? [ae.id, ae.value] : null;
  $('main').innerHTML = view === 'teraz' ? teraz() : view === 'zak' ? zaklady() : view === 'bust' ? busty() : view === 'bank' ? bankView() : view === 'bankm' ? bankModel() : view === 'model' ? model() : view === 'dane' ? dane() : pomoc();
  if (keep && $(keep[0])) { $(keep[0]).value = keep[1]; $(keep[0]).focus(); }
}
let back = 'teraz';
function go(v, u) { if (v === 'model' && view !== 'model') back = view; view = v; sel = u || null; render(); window.scrollTo(0, 0); }
document.addEventListener('click', e => {
  const q = s => e.target.closest(s);
  let b;
  if ((b = q('nav button'))) return go(b.dataset.v);
  if ((b = q('[data-add]'))) { const t = b.dataset.add, i = $('in_' + t); addCode(t, i.value.trim()); return; }
  if ((b = q('[data-lostok]'))) { lsSet(MAXK(b.dataset.lostok), String(D[b.dataset.lostok].n)); return render(); }
  if ((b = q('[data-undo]'))) return undoCode(b.dataset.undo);
  if ((b = q('[data-paste]'))) return pasteCodes(b.dataset.paste);
  if ((b = q('[data-undob]'))) return undoBatch(b.dataset.undob);
  if ((b = q('[data-autobk]'))) { lsSet(ABK, b.checked ? '1' : '0'); return render(); }
  if ((b = q('[data-exp]'))) { const [t, i] = b.dataset.exp.split(':'); return exportFile(t, +i); }
  if ((b = q('[data-bkw]'))) { bkw = +b.dataset.bkw === 5 ? 5 : 3; lsSet('moje_v1_bkw', String(bkw)); return render(); }
  if ((b = q('[data-only]'))) { only = b.dataset.only; lsSet('moje_v1_only', only); return render(); }
  if ((b = q('[data-bsave]'))) { const it = items.find(x => x.uid === b.dataset.bsave), f = b.closest('.btf'); if (it) saveBet(it, +f.querySelector('.fNr').value - 1, +f.querySelector('.fK').value, +f.querySelector('.fZl').value); return; }
  if ((b = q('[data-fo]'))) { formU = formU === b.dataset.fo ? null : b.dataset.fo; return render(); }
  if (q('.btf')) return;   // pola formularza zakładu — nie otwieraj modelu
  if ((b = q('[data-restbet]'))) { e.stopPropagation(); document.querySelectorAll('.toast').forEach(t => t.remove()); return restBet(); }
  if ((b = q('[data-delbet]'))) { e.stopPropagation(); return delBet(bets[+b.dataset.delbet]); }
  if ((b = q('[data-untrack]'))) { const it = items.find(x => x.uid === sel); if (it) untrack(it); return; }
  if ((b = q('[data-zsrc]'))) { zsrc = b.dataset.zsrc; lsSet('moje_v1_zsrc', zsrc); return render(); }
  if ((b = q('[data-bsrc]'))) { bsrc = b.dataset.bsrc; lsSet('moje_v1_bsrc', bsrc); return render(); }
  if ((b = q('[data-bsub]'))) { bsub = b.dataset.bsub; lsSet('moje_v1_bsub', bsub); return render(); }
  if ((b = q('[data-bk]'))) { const k = +b.dataset.bk; bks = !k ? [] : bks.includes(k) ? bks.filter(x => x !== k) : [...bks, k].sort(); lsSet('moje_v1_bks', JSON.stringify(bks)); return render(); }
  if ((b = q('[data-u2]'))) return go('model', b.dataset.u2);
  if ((b = q('[data-move]'))) return moveTo(b.dataset.mu, b.dataset.move);
  if ((b = q('[data-bkdel]'))) return bankDel(b.dataset.bkdel);
  if ((b = q('[data-bkm]'))) return go('bankm', b.dataset.bkm);
  if ((b = q('[data-go]'))) return go(b.dataset.go);
  if ((b = q('[data-bq]'))) { bqSel = b.dataset.bq; return bqUpd(); }
  if ((b = q('.mc[data-u],.rw[data-u]'))) return go('model', b.dataset.u);
  if ((b = q('.bt[data-bi]'))) { const x = bets[+b.dataset.bi]; if (x && x.it) go('model', x.it.uid); else toast('Tego modelu nie ma już w MOJE'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id && e.target.id.startsWith('in_')) { const t = e.target.id.slice(3); addCode(t, e.target.value.trim()); } });
document.addEventListener('input', e => {   // formularz zakładu: zmiana kroku → stawka tego kroku (dopóki kwoty nie zmieniono ręcznie)
  const c = e.target.classList; if (!c) return;
  if (c.contains('fZl')) e.target.dataset.ed = '1';
  if (c.contains('fK')) { const z = e.target.closest('.btf').querySelector('.fZl'), k = +e.target.value; if (!z.dataset.ed && k >= 1 && k <= 8) z.value = ST[k - 1]; }
});
document.addEventListener('input', e => { if (e.target.id === 'bq_in') { bq = e.target.value; bqSel = ''; if (bq.trim()) plLoad(only); bqUpd(); } });   // wyszukiwarka modeli (BANK)
document.addEventListener('input', e => {   // 3 cyfry → od razu dodaj
  const t = e.target.id && e.target.id.startsWith('in_') ? e.target.id.slice(3) : null; if (!t) return;
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 3);
  if (e.target.value.length === 3 && validCode(t, e.target.value)) addCode(t, e.target.value);
});
document.addEventListener('change', e => {
  const t = e.target.dataset && e.target.dataset.imp, f = t && e.target.files && e.target.files[0]; if (!f) return;
  const fr = new FileReader(); fr.onload = () => { e.target.value = ''; importFile(t, String(fr.result), f.name); }; fr.readAsText(f);
});
// przytrzymanie nagłówka [data-lp] → zakładka (krótkie dotknięcie zwija / rozwija grupę)
let lpT = null, lpOn = false, lpUp = 0, lpXY = null;   // lpOn = przytrzymanie zadziałało, palec jeszcze na ekranie
const lpStop = () => { clearTimeout(lpT); lpT = null; };
document.addEventListener('pointerdown', e => { const s = e.target.closest && e.target.closest('[data-lp]'); if (!s) return; lpXY = [e.clientX, e.clientY]; lpStop();
  lpT = setTimeout(() => { lpT = null; lpOn = true; try { navigator.vibrate && navigator.vibrate(30); } catch (x) {} go(s.dataset.lp); }, 550); });
document.addEventListener('pointerup', () => { lpStop(); if (lpOn) { lpOn = false; lpUp = Date.now(); } }); document.addEventListener('pointercancel', () => { lpStop(); lpOn = false; });
document.addEventListener('pointermove', e => { if (lpT && lpXY && Math.hypot(e.clientX - lpXY[0], e.clientY - lpXY[1]) > 12) lpStop(); });
document.addEventListener('click', e => { if (lpOn || Date.now() - lpUp < 350) { e.preventDefault(); e.stopPropagation(); lpUp = 0; } }, true);   // „klik” z puszczenia palca po przytrzymaniu — nie zwijaj i nie klikaj w nowym ekranie
document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('[data-lp]')) e.preventDefault(); });
window.addEventListener('storage', () => reload());
document.addEventListener('visibilitychange', () => { if (!document.hidden) reload(); });
setInterval(() => { if (!document.hidden && !(document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName))) render(); }, 30000);
reload();
// ?open=<t>~<app>~<cel>~<model> — z aplikacji SZUKAJ („⇢ Gram — dodaj do MOJE”): od razu ekran modelu
(() => { const u = new URLSearchParams(location.search).get('open'); if (!u) return;
  history.replaceState(null, '', location.pathname);
  if (items.some(x => x.uid === u)) go('model', u); else toast('Model jeszcze nie jest w MOJE'); })();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('moje-sw.js').catch(() => {});

<script>
"use strict";
// ===== napisy na ekranie: BUST → LOST (tylko to, co widać; dane, zapisy i obliczenia bez zmian) =====
function LOSTIFY(doc, keepNames) {   // keepNames: zostaw nazwę tabeli / modeli „BUST” z RAZEM T60 (2 = też sam napis „BUST”, np. zakładka tabeli)
  try {
    if (!doc || doc.__lost) return; doc.__lost = 1;
    const RX = keepNames ? /\bBUST\b(?! 012| ODM| ·| [A-Z]\d[A-Z0-9])|\bbusty\b|\bBusty\b/g : /\bBUST\b|\bbusty\b|\bBusty\b/g;
    const keep = v => keepNames === 2 && /^\s*BUST\s*$/.test(v);
    const fix = n => { const pa = n.parentNode; if (pa && /^(SCRIPT|STYLE|TEXTAREA)$/.test(pa.nodeName)) return; const v = n.nodeValue; if (!v || !/BUST|usty/.test(v) || keep(v)) return; const f = v.replace(RX, m => m === 'BUST' ? 'LOST' : m === 'busty' ? 'losty' : 'Losty'); if (f !== v) n.nodeValue = f; };
    const walk = r => { if (r.nodeType === 3) return fix(r); if (r.nodeType !== 1 || /^(SCRIPT|STYLE|TEXTAREA)$/.test(r.nodeName)) return; const w = doc.createTreeWalker(r, 4); let n; while ((n = w.nextNode())) fix(n); };
    const root = doc.body || doc.documentElement; walk(root);
    new doc.defaultView.MutationObserver(ms => ms.forEach(m => m.type === 'characterData' ? fix(m.target) : m.addedNodes.forEach(walk)))
      .observe(root, { childList: true, subtree: true, characterData: true });
  } catch (e) {}
}
LOSTIFY(document, 2);
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
try { localStorage.removeItem('moje_v1_noteraz'); } catch (e) {}   // po wycofanym „trybie gry” (1.18.0)   // pamięć trwała: Android nie czyści jej sam przy braku miejsca
</script>
