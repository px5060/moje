<!DOCTYPE html>

<style>
:root{--bg:#12151c;--pan:#1b1f2a;--card:#242a38;--bd:#323a4d;--tx:#e8ebf2;--mu:#8b93a7;--or:#c97a45;--or2:#d6a07c;--gr:#5fd38a;--rd:#ff8a8a;--bl:#9fc4ff;--ye:#FFD700}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--pan);border-bottom:1px solid var(--bd);padding:8px 12px}
header .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
header h1{font-size:16px;margin:0}header .n{color:var(--mu);font-size:12px}
main{padding:10px 12px 90px;max-width:760px;margin:0 auto}
.btn{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600}
.btn.pri{background:var(--or);border-color:var(--or);color:#fff}.btn.ok{background:#1f8a4c;border-color:#1f8a4c;color:#fff}
.btn.wide{display:block;width:100%;margin-top:7px;text-align:center}
.btn.sm{padding:4px 9px;font-size:12.5px}
a.btn{text-decoration:none}
.hint{color:var(--mu);font-size:11.5px;margin-top:4px}
.chip{position:relative;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:16px;padding:5px 11px;font-size:13px;font-weight:600}
.chip.on{background:var(--or);border-color:var(--or);color:#fff}
.chip b.soon{position:absolute;top:-8px;left:-6px;min-width:16px;height:16px;border-radius:8px;background:var(--ye);color:#000;font:700 10px/16px system-ui;padding:0 4px;border:1px solid #fff}.chip i.nb{position:absolute;top:-8px;right:-6px;min-width:16px;height:16px;border-radius:8px;background:#c97a45;color:#fff;font:700 10px/16px system-ui;font-style:normal;padding:0 4px;border:1px solid #fff}
.tsw{display:flex;gap:8px;margin-bottom:8px}.tsw button{flex:1;position:relative;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:10px;font-size:17px;font-weight:800}
.tsw.sub.src button.on{background:#6a1a1a;border-color:#a8423a}.tsw.sub button{font-size:14px;padding:8px}.tsw.sub button.on{background:#8e2a2a;border-color:#8e2a2a}
.tsw.sub.zs button.on{background:#2e4a6a;border-color:#4d7fb3}.tsw.sub.zs button{font-size:13px;padding:8px 4px}
.tsw button.on{background:var(--or);border-color:var(--or);color:#fff}.tsw small{font-size:12px;font-weight:600;opacity:.85}
.tsw b.soon{position:absolute;top:-7px;left:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--ye);color:#000;font:700 11px/18px system-ui;padding:0 4px;border:1px solid #fff}
.tsw i.nb{position:absolute;top:-7px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:#c97a45;color:#fff;font:700 11px/18px system-ui;font-style:normal;padding:0 4px;border:1px solid #fff}
.sec{background:var(--pan);border:1px solid var(--bd);border-radius:11px;padding:6px 8px;margin-bottom:10px}
.sec .sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:800;font-size:14px;padding:4px 2px 6px;cursor:pointer;position:relative}
.sec .sh .m{color:var(--mu);font-size:11.5px;font-weight:500;text-align:right}
.sec.snow{border-color:var(--or);box-shadow:0 0 0 1px var(--or) inset}.sec.ssoon{border-color:#8a7a20}.sec.sbust{border-color:#8a1f1f}
.sec.link{cursor:pointer}.sec .sh b.soon,.sec .sh i.nb{position:static;display:inline-block;margin-left:6px;min-width:18px;height:18px;border-radius:9px;font:700 11px/18px system-ui;text-align:center;padding:0 4px}
.sec .sh b.soon{background:var(--ye);color:#000}.sec .sh i.nb{background:#c97a45;color:#fff;font-style:normal}
.sec .none{color:var(--mu);font-size:12.5px;padding:2px 4px 6px}
.sec .kh{color:var(--mu);font-size:12px;font-weight:700;margin:8px 2px 4px;border-bottom:1px solid var(--bd);padding-bottom:2px}
details.sec>summary{list-style:none}details.sec>summary::-webkit-details-marker{display:none}details.sec>summary .m::after{content:' ▾'}details.sec[open]>summary .m::after{content:' ▴'}
.rw{background:var(--card);border-left:4px solid #2e75b6;border-radius:8px;padding:6px 8px;margin-bottom:5px;cursor:pointer}

.sec.slnow{border-color:#8e2a2a;box-shadow:0 0 0 1px #8e2a2a inset}

.rw.abust .graj{background:#8e2a2a}
.rw.Sp{border-left-color:#7030a0}.rw.R{border-left-color:#1f8a4c}.rw.B{border-left-color:#b3261e}.rw.now{background:#3a2a1c}
.rw .l1{display:flex;align-items:center;gap:6px;font-size:14px}.rw .l1 .sp{flex:1}.rw .l1 .zl{min-width:52px;text-align:right}.rw .l1 .btn{padding:3px 9px}.rw .l1 .ok{font-weight:800;padding:0 6px}

.flt{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
/* wpis kodów */

.kod .src{color:var(--mu);font-size:11.5px}
.erow{display:flex;gap:6px;margin-top:7px}
.erow input{flex:1;min-width:0;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:8px 10px;font-size:18px;letter-spacing:3px}
.prev{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--mu);align-items:center}
.prev b{color:var(--tx);background:var(--card);border-radius:5px;padding:1px 5px;font-weight:600;font-variant-numeric:tabular-nums}
/* grupy */
.grp{margin:14px 0 6px;font-weight:800;font-size:14px;display:flex;justify-content:space-between;align-items:baseline}
.grp .m{color:var(--mu);font-size:12px;font-weight:500}
.mc{border-left:6px solid var(--bd);background:var(--card);border-radius:9px;padding:8px 10px;margin-bottom:7px;cursor:pointer}

.mc.soon{border-left-color:var(--ye)}.mc.wait{border-left-color:#2e75b6}.mc.bust{border-left-color:#ff4444}
.mc.done{border-left-color:var(--gr);opacity:.85}.mc.donel{border-left-color:#a0606a;opacity:.85}
.mc .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mc .id{font-weight:800;font-size:14px}

.mc .st{margin-top:4px;font-size:13.5px}
.mc .big{font-size:16px;font-weight:800;color:#fff}
.mc .bet{margin-top:5px;font-size:12.5px;color:var(--bl)}
.btf{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;margin-top:7px}.btf label{display:flex;flex-direction:column;font-size:10.5px;color:var(--mu);gap:2px}
.btf input{width:58px;padding:6px;border-radius:7px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;font-weight:700}.btf .fNr{width:84px}.btf .fZl{width:70px}
.btf button{flex:1;min-width:120px;padding:8px}.btf.wide button{font-size:14px}
.mc .row2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.bdg{display:inline-block;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:800;color:#fff;margin-right:4px;vertical-align:1px}
.bdg.S{background:#2e75b6}.bdg.R{background:#1f8a4c}.bdg.Sp{background:#7030a0}.bdg.B{background:#b3261e}
.kk{display:inline-block;border-radius:5px;padding:0 6px;background:#3d4760;font-weight:800;font-size:12.5px}
.pos{color:var(--gr)}.neg{color:var(--rd)}.mu{color:var(--mu)}
.empty{background:var(--pan);border:1px dashed var(--bd);border-radius:10px;padding:14px;color:var(--mu);text-align:center}
details{margin-top:10px}summary{cursor:pointer;font-weight:700;color:var(--mu);padding:6px 0}
/* zakłady */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.sum div{background:var(--pan);border:1px solid var(--bd);border-radius:9px;padding:7px;text-align:center;font-size:11.5px;color:var(--mu)}
.sum b{display:block;font-size:17px;color:var(--tx)}
.bt{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:8px;padding:7px 9px;margin-bottom:5px;cursor:pointer;font-size:13px}
.bt .r{margin-left:auto;text-align:right;font-weight:700}
.bt.win{border-left:4px solid var(--gr)}.bt.lost{border-left:4px solid #ff4444}.bt.pend{border-left:4px solid var(--or)}.bt.none{border-left:4px solid var(--mu)}
/* model */
.box{background:var(--pan);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;margin-bottom:9px}
.box h4{margin:0 0 6px;font-size:13.5px}
.box ol{margin:0;padding-left:20px}.box li{margin:3px 0}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.kv div{background:var(--card);border-radius:7px;padding:5px;text-align:center;font-size:11px;color:var(--mu)}
.kv b{display:block;font-size:15px;color:var(--tx)}
.bars{display:flex;gap:4px;align-items:flex-end;height:70px;margin-top:6px}
.bars div{flex:1;background:#2e75b6;border-radius:3px 3px 0 0;position:relative;min-height:2px}
.bars span{position:absolute;top:-15px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--tx)}
.bl{display:flex;gap:4px;font-size:10.5px;color:var(--mu)}.bl span{flex:1;text-align:center}
.cyc{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.cyc b{font-size:11px;border-radius:4px;padding:1px 4px;background:#2b4a37}.cyc b.x{background:#8a1f1f}
table.rows{width:100%;border-collapse:collapse;font-size:12.5px}
table.rows td{padding:4px 5px;border-top:1px solid var(--bd)}
table.rows td.nr{color:var(--mu);width:62px;font-variant-numeric:tabular-nums}table.rows td.cd{width:44px;font-weight:700;letter-spacing:1px}
table.rows tr.k6 td{background:#1f3d2a}table.rows tr.k7 td{background:#3d1f22}table.rows tr.k8 td{background:#6b1414}
table.rows tr.k4 td,table.rows tr.k5 td{background:#3a2a1c}table.rows tr.k3 td,table.rows tr.k10 td{color:var(--bl)}
table.rows tr.nx td{background:#c97a45;color:#fff;font-weight:800}
.back{margin-bottom:8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--pan);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:12px 2px;font-size:13px;font-weight:700;position:relative}
nav button.on{color:var(--or2)}
nav b.soon,.grp b.soon{position:absolute;top:3px;left:2px;min-width:16px;height:16px;border-radius:8px;background:var(--ye);color:#000;font:700 10px/16px system-ui;padding:0 4px;border:1px solid #fff}
nav i.nb{position:absolute;top:3px;right:2px;min-width:16px;height:16px;border-radius:8px;background:#c97a45;color:#fff;font:700 10px/16px system-ui;font-style:normal;padding:0 4px;border:1px solid #fff}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#000d;color:#fff;padding:8px 14px;border-radius:9px;font-size:13px;z-index:70;max-width:92vw}
.respop{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);z-index:60;width:min(94vw,560px);border-radius:12px;padding:10px 14px;color:#fff;box-shadow:0 8px 30px #000a;cursor:pointer}
.respop.win{background:#1f8a4c}.respop.loss{background:#b3261e}.respop.nil{background:#2b3245}
.respop .h{font-size:20px;font-weight:900}.respop .i{padding:3px 0;border-top:1px solid #ffffff33;font-size:13px}.respop .x{font-size:11px;opacity:.75;margin-top:5px;text-align:right}
</style>

<body>
<header><div class="t"><h1>MOJE · wszystkie gry</h1><span class="n" id="ver"></span></div></header>
<main id="main"></main>
<nav>
  <button data-v="teraz" class="on" id="navT">TERAZ</button>
  <button data-v="bust" id="navB">LOST</button>
  <button data-v="zak" id="navZ">ZAKŁADY</button>
  <button data-v="dane">KODY</button>
  <button data-v="pom">POMOC</button>
</nav>
<script>
"use strict";
const APP_VER = '1.13.5';
const TABS = __TABS__;   // {t50:{name, seed, key, alph, targets}, t60:{…}} — kody wspólne z RAZEM i SZUKAJ (ten sam klucz pamięci)
// aplikacje źródłowe: ich MOJE (modele, które gram) i MOJE ZAKŁADY czytane ze wspólnej pamięci telefonu (ten sam adres px5060.github.io)
const SRC = [
  { a: 'S', cls: 'S', name: 'SZUKAJ', pfx: '_szukaj_v1_', nf: 5, url: { t50: '/szukaj50/', t60: '/szukaj60/' } },
  { a: 'S+', cls: 'Sp', name: 'SZUKAJ+', pfx: '_szukajp_v1_', nf: 7, url: { t50: '/szukaj50plus/', t60: '/szukaj60plus/' } },
  { a: 'L', cls: 'B', name: 'SZUKAJ LOST', pfx: '_szbust_v1_', nf: 5, url: { t50: '/szukajbust50/', t60: '/szukajbust60/' } },
];
const ST = [8, 8, 16, 32, 64, 128, 256, 512], CUM = [8, 16, 32, 64, 128, 256, 512, 1024];
const TPOS = { x1x: 1, xx1: 2, '1xx': 0 };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
const jget = k => { try { const v = JSON.parse(lsGet(k, '[]')); return Array.isArray(v) ? v : []; } catch (e) { return []; } };
const fmtN = n => n.toLocaleString('pl');
const zl = v => `<span class="${v > 0 ? 'pos' : v < 0 ? 'neg' : ''}">${v > 0 ? '+' : v < 0 ? '−' : ''}${fmtN(Math.abs(v))} zł</span>`;
function toast(t) { document.querySelectorAll('.toast').forEach(x => x.remove()); const o = document.createElement('div'); o.className = 'toast'; o.innerHTML = t; document.body.appendChild(o); setTimeout(() => o.remove(), 2600); }

// ---- czas słowami: „przed chwilą”, „5 minut temu”, „2 dni temu” ----
function pl(n, f) { const a = n % 10, b = n % 100; return n === 1 ? f[0] : a >= 2 && a <= 4 && (b < 12 || b > 14) ? f[1] : f[2]; }
function ago(t) {
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return 'przed chwilą';
  const m = Math.floor(s / 60); if (m < 60) return `${m} ${pl(m, ['minutę', 'minuty', 'minut'])} temu`;
  const h = Math.floor(m / 60); if (h < 24) return `${h} ${pl(h, ['godzinę', 'godziny', 'godzin'])} temu`;
  const d = Math.floor(h / 24); return d === 1 ? 'wczoraj' : `${d} ${pl(d, ['dzień', 'dni', 'dni'])} temu`;
}
const when = t => { const d = new Date(t); return `${d.getDate()}.${String(d.getMonth() + 1).padStart(2, '0')} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; };

// ===== KODY (wspólne z RAZEM i SZUKAJ) =====
const D = {};   // t → {n, s, X, Y:{tgt}}
function readAdded(t) { const s = lsGet(TABS[t].key, ''); return /^(\d{3})*$/.test(s) ? s : ''; }
function loadCodes(t) {
  const T = TABS[t], s = T.seed + readAdded(t), n = s.length / 3, X = new Int8Array(n);
  for (let i = 0; i < n; i++) X[i] = T.alph.indexOf(s.substr(3 * i, 3));
  const Y = {}; T.targets.forEach(g => { Y[g] = Uint8Array.from(T.alph.map(c => c[TPOS[g]] === '1' ? 1 : 0)); });
  D[t] = { t, n, s, X, Y, AL: T.alph, tc: new Map() };
}
const code = (t, i) => D[t].s.substr(3 * i, 3);
// dziennik: kiedy wpisano ostatni kod (tu albo w innej aplikacji — wtedy „zauważony” przy otwarciu MOJE)
const LOGK = t => 'moje_v1_codelog_' + t;
function syncLog(t) {
  let L = jget(LOGK(t)); const n = D[t].n, add = readAdded(t).length / 3;
  L = L.filter(e => e && e.n <= n && code(t, e.n - 1) === e.c);
  const last = L[L.length - 1];
  if (add > 0 && (!last || last.n < n)) L.push({ n, c: code(t, n - 1), t: Date.now(), here: 0 });
  lsSet(LOGK(t), JSON.stringify(L.slice(-300)));
  return L;
}
function validCode(t, c) { return t === 't50' ? /^[01]{3}$/.test(c) : /^[0-3][01]{2}$/.test(c); }
function addCode(t, c) {
  if (!validCode(t, c)) { toast(t === 't50' ? 'Kod T50: trzy cyfry 0/1, np. 010' : 'Kod T60: pierwsza cyfra 0–3, potem dwie 0/1, np. 210'); return; }
  const row = D[t].n, before = items.filter(it => !it.rz && it.t === t && it.grp !== 'done' && it.r.ph === 2 && it.r.wz === row);
  if (!lsSet(TABS[t].key, readAdded(t) + c)) { alert('BŁĄD zapisu pamięci telefonu!'); return; }   // czytaj-zmień-zapisz: nie gubi kodów z innych aplikacji
  const L = jget(LOGK(t)); L.push({ n: row + 1, c, t: Date.now(), here: 1 }); lsSet(LOGK(t), JSON.stringify(L.slice(-300)));
  reload();
  resultPop(t, row, c, before);
}
// ===== KODY: wklejanie kilku naraz, import pliku, eksport (nazwy i format jak w RAZEM: PIKOFF / TRÓJKA — appki na PC je wychwytują) =====
function srcTxt(e) { return e.here === 1 ? ', wpisany tutaj' : e.here === 2 ? `, z pliku ${esc(e.f || '')}` : e.here === 3 ? ', wklejony tutaj' : ', wpisany w innej aplikacji — tu zauważony'; }
const IMPK = t => 'moje_v1_lastimp_' + t, EXPK = t => 'moje_v1_lastexp_' + t;
function jobj(k) { try { const v = JSON.parse(lsGet(k, 'null')); return v && typeof v === 'object' ? v : null; } catch (e) { return null; } }
function appendBatch(t, arr, how, f) {   // dopisz kody na koniec (czytaj-zmień-zapisz), zapisz w dzienniku i jako ostatni import (do cofnięcia)
  const from = D[t].n;
  if (!lsSet(TABS[t].key, readAdded(t) + arr.join(''))) { alert('BŁĄD zapisu pamięci telefonu!'); return false; }
  const now = Date.now(), L = jget(LOGK(t));
  arr.forEach((c, i) => L.push({ n: from + i + 1, c, t: now, here: how, f }));
  lsSet(LOGK(t), JSON.stringify(L.slice(-300)));
  lsSet(IMPK(t), JSON.stringify({ from, to: from + arr.length, f: f || '', how, t: now, tail: arr.join('') }));
  reload(); return true;
}
function normCodes(raw) { return raw.map(x => String(x == null ? '' : x).trim()).map(x => /^\d{1,3}(\.0+)?$/.test(x) ? String(parseInt(x, 10)).padStart(3, '0') : x); }
function importFile(t, text, fname) {   // pełny ciąg od Nr 1 (eksport RAZEM / PIKOFF / TRÓJKA / SZUKAJ / MOJE) — dopisuje tylko nowe kody

    <div class="box"><h4>Kody</h4>Kody są wspólne z RAZEM i SZUKAJ — wpisany tu kod jest od razu we wszystkich aplikacjach (i odwrotnie). Przy każdej tabeli widać ostatni kod i <b>kiedy</b> go wpisano. Gdy kod wpisano w innej aplikacji, MOJE pokazuje, kiedy go tu zauważyło (przy otwarciu).<br>Zakładka <b>KODY</b>: kilka kodów naraz, import pliku (z cofnięciem całego importu) i eksport z nazwami jak w RAZEM — T50: TRÓJKA <b>v13_…kod.json</b>, T60: <b>xx1_pikoff_…json</b> i <b>trojka_xx1_v13_…kod.json</b>, żeby appki na PC je wychwyciły.</div>

    <div class="box"><h4>Dodawanie modeli</h4>W aplikacji SZUKAJ przytrzymaj kartę modelu → <b>⇢ Gram — dodaj do MOJE</b>. Aplikacja doda model i otworzy go tutaj.</div>

function LOSTIFY(doc, keepNames) {   // keepNames: zostaw nazwę tabeli / modeli „BUST” z RAZEM T60 (2 = też sam napis „BUST”, np. zakładka tabeli)
  try {
    if (!doc || doc.__lost) return; doc.__lost = 1;
    const RX = keepNames ? /\bBUST\b(?! 012| ODM| ·| [A-Z]\d[A-Z0-9])|\bbusty\b|\bBusty\b/g : /\bBUST\b|\bbusty\b|\bBusty\b/g;
    const keep = v => keepNames === 2 && /^\s*BUST\s*$/.test(v);
    const fix = n => { const pa = n.parentNode; if (pa && /^(SCRIPT|STYLE|TEXTAREA)$/.test(pa.nodeName)) return; const v = n.nodeValue; if (!v || !/BUST|usty/.test(v) || keep(v)) return; const f = v.replace(RX, m => m === 'BUST' ? 'LOST' : m === 'busty' ? 'losty' : 'Losty'); if (f !== v) n.nodeValue = f; };
    const walk = r => { if (r.nodeType === 3) return fix(r); if (r.nodeType !== 1 || /^(SCRIPT|STYLE|TEXTAREA)$/.test(r.nodeName)) return; const w = doc.createTreeWalker(r, 4); let n; while ((n = w.nextNode())) fix(n); };
    const root = doc.body || doc.documentElement; walk(root);
    new doc.defaultView.MutationObserver(ms => ms.forEach(m => m.type === 'characterData' ? fix(m.target) : m.addedNodes.forEach(walk)))
      .observe(root, { childList: true, subtree: true, characterData: true });
  } catch (e) {}
}
LOSTIFY(document, 2);
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}   // pamięć trwała: Android nie czyści jej sam przy braku miejsca
